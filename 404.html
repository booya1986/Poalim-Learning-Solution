<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>העמוד לא נמצא</title>
<script>
  // GitHub Pages paths are case-sensitive. Redirect any casing of a known page to its real path.
  (function () {
    var base = "/Poalim-Learning-Solution/";
    var pages = ["vibe-coding-in-LD", "campus-2027-summary"];
    var path = location.pathname;
    if (path.toLowerCase().indexOf(base.toLowerCase()) !== 0) return;
    var rest = path.slice(base.length);
    var first = rest.split("/")[0].toLowerCase();
    for (var i = 0; i < pages.length; i++) {
      if (pages[i].toLowerCase() === first && pages[i] !== rest.split("/")[0]) {
        var tail = rest.slice(rest.split("/")[0].length) || "/";
        location.replace(base + pages[i] + tail + location.search + location.hash);
        return;
      }
    }
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff; color: #222; padding: 16px; text-align: center; }
  a { color: #c8102e; }
</style>
</head>
<body>
  <main>
    <h1>העמוד לא נמצא</h1>
    <p><a href="/Poalim-Learning-Solution/">לכל העמודים</a></p>
  </main>
</body>
</html>
